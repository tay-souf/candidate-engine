version: '3.9'
name: stratton-engine

services:
  # ====================================
  # PostgreSQL Database
  # ====================================
  postgres:
    image: postgres:16-alpine
    container_name: sce-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stratton_engine}
      POSTGRES_USER: ${POSTGRES_USER:-stratton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stratton_secure_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stratton}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sce-network

  # ====================================
  # Redis (Queue & Cache)
  # ====================================
  redis:
    image: redis:7-alpine
    container_name: sce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_2024}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sce-network

  # ====================================
  # n8n Automation Engine
  # ====================================
  n8n:
    image: n8nio/n8n:latest
    container_name: sce-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin_secure_2024}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-stratton_engine}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-stratton}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-stratton_secure_2024}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-stratton-n8n-encryption-key-change-me}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/workflows
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sce-network

  # ====================================
  # Stratton Candidate Engine API
  # ====================================
  engine-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sce-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-stratton}:${POSTGRES_PASSWORD:-stratton_secure_2024}@postgres:5432/${POSTGRES_DB:-stratton_engine}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_2024}@redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - RETELL_API_KEY=${RETELL_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-encryption-key-in-production}
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret-in-production}
      - N8N_API_URL=http://n8n:5678
      - N8N_API_KEY=${N8N_API_KEY}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL:-http://localhost:3000}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./integrations:/app/integrations
      - ./services:/app/services
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sce-network

  # ====================================
  # Supabase Studio (Optional - DB UI)
  # ====================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sce-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@stratton.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_secure_2024}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sce-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local

networks:
  sce-network:
    driver: bridge
    name: stratton-network
